name: Protocol Sync

on:
  repository_dispatch:
    types: [protocol-release]

jobs:
  sync:
    name: Sync protocol ${{ github.event.client_payload.protocol_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download protocol release artifacts
        run: |
          TAG="${{ github.event.client_payload.protocol_tag }}"
          mkdir -p ./protocol-artifacts
          gh release download "$TAG" \
            --repo invisi-lab/invisi-protocol \
            --pattern "protocol-artifacts.tar.gz" \
            --pattern "InvisiPool.json" \
            --dir ./protocol-artifacts-raw
          tar -xzf ./protocol-artifacts-raw/protocol-artifacts.tar.gz -C ./protocol-artifacts
          cp ./protocol-artifacts-raw/InvisiPool.json ./protocol-artifacts/InvisiPool.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ABI — copy raw JSON
        run: |
          cp ./protocol-artifacts/InvisiPool.json packages/contracts/src/abis/InvisiPool.raw.json

      - name: Update ABI — regenerate TypeScript from JSON
        run: |
          node -e "
          const abi = require('./packages/contracts/src/abis/InvisiPool.raw.json').abi;
          const ts = '// AUTO-GENERATED by invisi-protocol CI. Do not edit manually.\n' +
                     'export const invisiPoolAbi = ' + JSON.stringify(abi, null, 2) + ' as const\n';
          require('fs').writeFileSync('./packages/contracts/src/abis/InvisiPool.ts', ts);
          "

      - name: Update deployments registry — regenerate TypeScript from JSON
        run: |
          node -e "
          const fs = require('fs');
          const chains = {};
          for (const env of ['mainnet', 'testnet']) {
            const dir = './protocol-artifacts/deployments/' + env;
            if (!fs.existsSync(dir)) continue;
            for (const file of fs.readdirSync(dir)) {
              const data = JSON.parse(fs.readFileSync(dir + '/' + file, 'utf8'));
              chains[data.chainId] = data;
            }
          }
          const rows = Object.entries(chains).map(([id, d]) =>
            id + ': ' + JSON.stringify(d)
          ).join(',\n  ');
          const ts = 'import type { ChainDeployment } from \"./types\"\n\nconst DEPLOYMENTS: Record<number, ChainDeployment> = {\n  ' + rows + '\n}\n\nexport function getDeployment(chainId: number): ChainDeployment {\n  const d = DEPLOYMENTS[chainId]\n  if (!d) throw new Error(\"Unsupported chainId: \" + chainId)\n  return d\n}\n\nexport function getSupportedChainIds(): number[] {\n  return Object.keys(DEPLOYMENTS).map(Number)\n}\n';
          fs.writeFileSync('./packages/deployments/src/registry.ts', ts);
          "

      - name: Update bb_version in @invisi/core
        run: |
          BB_VERSION="${{ github.event.client_payload.bb_version }}"
          cd packages/core
          pnpm add @aztec/bb.js@$BB_VERSION

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: sync protocol ${{ github.event.client_payload.protocol_tag }}"
          body: |
            Auto-generated sync from invisi-protocol ${{ github.event.client_payload.protocol_tag }}

            Changes:
            - Updated InvisiPool ABI
            - Updated deployments registry
            - Pinned @aztec/bb.js to bb_version ${{ github.event.client_payload.bb_version }}
          branch: "sync/protocol-${{ github.event.client_payload.protocol_tag }}"
          commit-message: "chore: sync protocol ${{ github.event.client_payload.protocol_tag }}"
