name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source formatting
        run: pnpm format:check

      - name: Build all packages
        run: pnpm build

      - name: Run the offline Note output example
        run: pnpm examples

      - name: Check public API and example boundaries
        run: pnpm check:surface

      - name: Run package tests with bounded concurrency
        run: pnpm exec turbo run test --concurrency=1 -- --maxWorkers=2 --minWorkers=1

      - name: Run real native and WASM proof tests sequentially
        run: |
          SDK_BB_BIN="$PWD/packages/prover/node_modules/@aztec-foundation/bb.js/build/amd64-linux/bb"
          test -x "$SDK_BB_BIN"
          "$SDK_BB_BIN" --version
          BB_BINARY_PATH="$SDK_BB_BIN" INVISI_TEST_WASM=1 pnpm --filter @invisi-labs/prover exec vitest run --maxWorkers=1 --minWorkers=1 --no-file-parallelism

      - name: Type check
        run: pnpm lint
