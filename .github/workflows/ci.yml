name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ts-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  previous:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-reuse.yml
    with:
      ref: ${{ github.sha }}
      branches: develop
  verify:
    needs: previous
    if: "!cancelled() && (needs.previous.result == 'success' || needs.previous.result == 'skipped') && needs.previous.outputs.verified != 'true'"
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
