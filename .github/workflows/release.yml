name: Release

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing requires Node >= 22.14 and npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release validation
        run: node --test scripts/check-release.test.mjs scripts/publish-release.test.mjs

      - name: Validate release versions and dependencies
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Build and pack release packages
        run: |
          pnpm build
          mkdir -p "$RUNNER_TEMP/release-packages"
          for package in packages/*; do
            pnpm --dir "$package" pack --pack-destination "$RUNNER_TEMP/release-packages"
          done

      - name: Validate packed versions and dependencies
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-packages"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for package in "$RUNNER_TEMP/release-packages/"*.tgz; do
            node scripts/publish-release.mjs "$package"
          done
