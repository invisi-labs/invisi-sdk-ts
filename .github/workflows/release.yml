name: Release

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      INVISI_PROVER_CACHE_DIR: ${{ github.workspace }}/.cache/invisi-prover
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing requires Node >= 22.14 and npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned public prover resources
        uses: actions/cache@v4
        with:
          path: .cache/invisi-prover
          key: prover-resources-${{ hashFiles('packages/prover/src/resources/pin.ts') }}

      - name: Explicitly provision verified pinned prover resources
        run: node scripts/sync-prover-assets.mjs

      - name: Verify tiny trusted Provenance metadata
        run: python3 scripts/sync-provenance.py --check-package packages/prover/src/resources

      - name: Test release validation
        run: node --test scripts/check-release.test.mjs scripts/publish-release.test.mjs scripts/provenance-assets.test.mjs scripts/release-archive.test.mjs

      - name: Validate release versions and dependencies
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Build and pack release packages
        run: |
          pnpm build
          mkdir -p "$RUNNER_TEMP/release-packages"
          for package in packages/*; do
            pnpm --dir "$package" pack --pack-destination "$RUNNER_TEMP/release-packages"
          done

      - name: Validate packed versions and dependencies
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-packages"

      - name: Verify installed package entry points and types
        run: node scripts/check-packed-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-packages"

      - name: Verify canonical release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-packages"
          node scripts/restore-release-archives.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-packages" "$RUNNER_TEMP/canonical-packages"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for package in primitives protocol prover rpc sdk session ipp react vue; do
            node scripts/publish-release.mjs "$RUNNER_TEMP/release-packages/invisi-labs-$package-${GITHUB_REF_NAME#v}.tgz"
          done
